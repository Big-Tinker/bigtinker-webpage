<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Big Tinker — IT-utveckling. Kontakta oss för förfrågningar om tjänster inom mjukvara och system.">
  <title>Big Tinker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf9f7;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2d4a3e;
      --border: #e8e6e3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #f0f0f0;
        --muted: #9a9a9a;
        --accent: #8fb9a8;
        --border: #2a2a2a;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 28rem;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin: 0 0 2.5rem;
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .divider {
      width: 2rem;
      height: 1px;
      margin: 0 auto 2.5rem;
      background: var(--border);
    }

    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.9375rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    a:hover,
    a:focus-visible {
      border-bottom-color: var(--accent);
      outline: none;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.875rem;
    }

    .site-footer {
      width: 100%;
      max-width: 28rem;
      margin-top: auto;
      padding-top: 2rem;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .site-footer p {
      margin: 0;
    }

    .site-footer .location {
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Big Tinker</h1>
    <div class="divider" aria-hidden="true"></div>
    <p>
      För förfrågningar om tjänster inom IT-utveckling är du välkommen att kontakta oss via e-post
    </p>
    <footer>
      <a href="mailto:kontakt@bigtinker.se">kontakt@bigtinker.se</a>
    </footer>
  </main>
  <footer class="site-footer">
    <p class="location">Karlstad, Sverige</p>
    <p class="copyright">
      © 2026 Big Tinker AB · Org.nr 559524-3543
    </p>
  </footer>
</body>
</html>
